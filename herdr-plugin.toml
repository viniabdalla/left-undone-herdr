id = "left-undone"
name = "Left Undone"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Track open tasks and promises from a Codex or Claude conversation"
platforms = ["linux"]

[[actions]]
id = "open"
title = "Left Undone: Open tasks"
contexts = ["workspace", "pane"]
command = ["python3", "left-undone", "open"]

[[panes]]
id = "panel"
title = "Left Undone"
placement = "split"
command = ["python3", "left-undone", "panel"]

[[panes]]
id = "picker"
title = "Left Undone: Choose conversation"
placement = "split"
command = ["python3", "left-undone", "pick"]
